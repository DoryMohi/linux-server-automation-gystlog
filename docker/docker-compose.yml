version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gystlog-web
    ports:
      - "8080:80"
    networks:
      - gystlog_network
    restart: always

  db:
    image: postgres:17
    container_name: gystlog-db
    environment:
      POSTGRES_DB: gystlogdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: AdminPassword123!
    ports:
      - "5432:5432"
    networks:
      - gystlog_network
    restart: always

networks:
  gystlog_network:
    driver: bridge
